<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!--
    SHL ICON SYSTEM
    ================
    Hand-built line-art marks, not a clip-art library. Consistent
    visual language: 64x64 viewBox, 3.5px stroke, round caps/joins,
    "currentColor" so the embedding context sets the color (brand red
    or charcoal — never both in one icon, keep it a single ink color
    per instance), and a recurring angular roofline motif (echoing the
    house mark in the SHL logo) used only where it's load-bearing, not
    repeated as decoration.

    Usage: copy the needed <symbol> into the poster's own <svg
    style="display:none"> block (posters are self-contained, no
    external file references for inline assets), then reference with
    <svg class="icon"><use href="#icon-name"/></svg>.

    Every icon here is used as REAL visual weight in a composition
    (sized 56px+), not as a small bullet decoration — if a layout wants
    to shrink one below ~40px, it's being used as a bullet, not
    artwork, and shouldn't be here.
  -->

  <!-- Direct Line — two nodes joined by one unbroken stroke, no
       intermediary node. Represents "a direct line to the loan officer,
       not a call center." -->
  <symbol id="icon-direct-line" viewBox="0 0 64 64">
    <circle cx="12" cy="48" r="5" fill="currentColor" stroke="none"/>
    <circle cx="52" cy="16" r="5" fill="currentColor" stroke="none"/>
    <line x1="16.5" y1="44" x2="47.5" y2="20" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
  </symbol>

  <!-- Under One Roof — a single roofline over a horizontal ground line
       with a checkmark beneath it. Represents in-house processing: the
       loan officer and processor work under the same roof. -->
  <symbol id="icon-under-roof" viewBox="0 0 64 64">
    <polyline points="8,30 32,10 56,30" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="14" y1="30" x2="14" y2="48" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="50" y1="30" x2="50" y2="48" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="10" y1="48" x2="54" y2="48" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <polyline points="23,39 29,45 42,32" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Verified Shield — a shield outline with a checkmark. Represents
       underwritten-before-issued pre-approvals. -->
  <symbol id="icon-verified-shield" viewBox="0 0 64 64">
    <path d="M32 7 L54 15 V30 C54 44 44 54 32 58 C20 54 10 44 10 30 V15 Z" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>
    <polyline points="21,31 29,39 44,22" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Local Pin — a location pin with a concentric ring, representing
       local market coverage (not a generic travel-pin cliche — the
       ring reads as "area," not "destination"). -->
  <symbol id="icon-local-pin" viewBox="0 0 64 64">
    <circle cx="32" cy="27" r="19" fill="none" stroke="currentColor" stroke-width="2" opacity="0.35"/>
    <path d="M32 10 C22 10 15 17 15 26 C15 38 32 54 32 54 C32 54 49 38 49 26 C49 17 42 10 32 10 Z" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="32" cy="26" r="6" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- Fast Response — clock face with hands set to a tight, decisive
       angle (not 12:00 default), representing same-day turnaround. -->
  <symbol id="icon-fast-response" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="24" fill="none" stroke="currentColor" stroke-width="3.5"/>
    <line x1="32" y1="32" x2="32" y2="17" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="32" y1="32" x2="43" y2="38" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="32" cy="32" r="2.5" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- Document Check — a document corner-fold with a checkmark, for
       processing/paperwork-adjacent content. -->
  <symbol id="icon-document-check" viewBox="0 0 64 64">
    <path d="M16 8 H40 L48 16 V56 H16 Z" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>
    <polyline points="40,8 40,16 48,16" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>
    <polyline points="23,36 30,43 42,28" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Partnership — two overlapping circles (a Venn mark), the overlap
       filled solid. Reads immediately as "two parties, shared ground"
       without literal hands/clip-art. -->
  <symbol id="icon-partnership" viewBox="0 0 64 64">
    <circle cx="24" cy="32" r="18" fill="none" stroke="currentColor" stroke-width="3.5"/>
    <circle cx="40" cy="32" r="18" fill="none" stroke="currentColor" stroke-width="3.5"/>
    <path d="M32 16.6 C36.6 20.8 39.4 26.1 39.4 32 C39.4 37.9 36.6 43.2 32 47.4 C27.4 43.2 24.6 37.9 24.6 32 C24.6 26.1 27.4 20.8 32 16.6 Z" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- Added Round 4 (production-validation capability tests): two new
       marks, same 64x64/3.5px-stroke/currentColor hand-drawn language
       as the set above, for content neither existing icon fit. -->

  <!-- Step Down — a line stepping down in two deliberate stages then
       running flat, ending in an arrowhead. Represents a payment or
       rate being brought down and held there (a buydown), without
       using a literal "%" glyph, which would read as a specific
       number rather than a concept. -->
  <symbol id="icon-step-down" viewBox="0 0 64 64">
    <polyline points="10,16 26,16 26,32 42,32 42,48 54,48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="47,42 54,48 47,54" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Credit Split — one line arriving from the top, branching into
       three even paths. Represents a single credit or sum being
       allocated across several destinations, used only as a diagram
       connector (not sized as standalone artwork the way the other
       icons in this file are). -->
  <symbol id="icon-credit-split" viewBox="0 0 64 64">
    <line x1="32" y1="6" x2="32" y2="26" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M32 26 C32 26 14 26 14 40 C14 46 14 50 14 54" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="32" y1="26" x2="32" y2="54" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M32 26 C32 26 50 26 50 40 C50 46 50 50 50 54" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="32" cy="26" r="3" fill="currentColor" stroke="none"/>
  </symbol>
</svg>
